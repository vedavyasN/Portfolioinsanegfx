<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INSANE GFX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
color:white;
background:#070b12;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,0.03);
backdrop-filter:blur(10px);
position:sticky;
top:0;
}

.logo{
font-size:24px;
font-weight:700;
}

nav{
display:flex;
gap:25px;
}

nav a{
color:white;
text-decoration:none;
opacity:.7;
}

nav a:hover{
color:#4aa3ff;
}

/* HERO */

.hero{
min-height:80vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:50px;
}

.hero button{
margin-top:20px;
padding:12px 30px;
border-radius:30px;
border:none;
cursor:pointer;
}

/* SECTION */

.section{
padding:100px 8%;
text-align:center;
}

.section h2{
margin-bottom:40px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
max-width:1100px;
margin:0 auto;
}

.card img{
width:100%;
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.card img:hover{
transform:scale(1.05);
}

#work{
margin-bottom:80px;
}

/* POPUP */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.popup img{
max-width:90%;
max-height:80%;
}

.back{
position:absolute;
top:20px;
left:20px;
font-size:30px;
cursor:pointer;
}

/* CONTACT */

.contact{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:80px 20px 30px;
text-align:center;
}

.contact h2{
font-size:36px;
margin-bottom:10px;
}

.contact p{
opacity:.7;
margin-bottom:20px;
}

.contact a{
padding:12px 30px;
background:white;
color:black;
border-radius:30px;
text-decoration:none;
font-weight:500;
transition:.3s;
}

.contact a:hover{
transform:scale(1.05);
}

/* SVG ICONS */

.socials{
display:flex;
justify-content:center;
gap:30px;
margin:30px 0 10px;
}

.socials a{
display:flex;
align-items:center;
justify-content:center;
}

.socials svg{
width:42px;
height:42px;
stroke:white;
fill:none;
stroke-width:2;
transition:.3s;
}

.socials svg:hover{
transform:scale(1.2);
stroke:#4aa3ff;
}

/* FOOTER */

footer{
text-align:center;
padding:15px;
opacity:.6;
}

</style>

</head>

<body>

<header>
<div class="logo">Insane gfx</div>
<nav>
<a href="#work">Work</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section class="hero">
<h1>Views Got Frozen?</h1>
<button onclick="scrollToWork()">View Portfolio</button>
</section>

<section class="section" id="work">
<h2>Recent Thumbnails</h2>

<div class="grid">

<div class="card">
<img src="img1.jpg" onclick="openImage(this.src)">
</div>

<div class="card">
<img src="img2.jpg" onclick="openImage(this.src)">
</div>

<div class="card">
<img src="img3.jpg" onclick="openImage(this.src)">
</div>

<div class="card">
<img src="img4.jpg" onclick="openImage(this.src)">
</div>

<div class="card">
<img src="img5.jpg" onclick="openImage(this.src)">
</div>

<div class="card">
<img src="img6.jpg" onclick="openImage(this.src)">
</div>

<div class="card">
<img src="img7.jpg" onclick="openImage(this.src)">
</div>

</div>
</section>

<!-- CONTACT -->

<section class="contact" id="contact">

<h2>Anything in mind?</h2>
<p>Let's talk</p>

<a href="https://instagram.com/insanegfx" target="_blank">
Let's Talk
</a>

</section>

<!-- SVG ICONS -->

<div class="socials">

<!-- Instagram SVG -->

<a href="https://instagram.com/insanegfx" target="_blank">
<svg viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5"/>
<circle cx="12" cy="12" r="4"/>
<circle cx="17.5" cy="6.5" r="1"/>
</svg>
</a>

<!-- Gmail SVG -->

<a href="mailto:insaneeditzgfx@gmail.com">
<svg viewBox="0 0 24 24">
<rect x="2" y="4" width="20" height="16" rx="2"/>
<path d="M2 6l10 7 10-7"/>
</svg>
</a>

</div>

<footer>
© 2026 INSANE GFX
</footer>

<!-- POPUP -->

<div class="popup" id="popup">
<span class="back" onclick="closePopup()">←</span>
<img id="popupImg">
</div>

<script>

function scrollToWork(){
document.getElementById("work").scrollIntoView({behavior:"smooth"});
}

function openImage(src){
document.getElementById("popup").style.display="flex";
document.getElementById("popupImg").src=src;
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
